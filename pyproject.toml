[project]
name = "trendwise-chatbot-api"
version = "1.0.0"
description = "Trendwise pre-sales chatbot API (FastAPI)."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.163.1",
    "httpx>=0.28.1",
    "pydantic>=2",
    "pydantic-settings>=2.16.2",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
extend-select = ["E", "W", "I", "N", "UP", "B", "D", "ANN"]
ignore = ["D203", "D213", "D105", "D107"]
