# The chat API. The cleaned corpus is baked into the image (corpus/).
#
#   docker compose up -d --build
#
# Secrets (CHAT_API_KEY, GROQ_API_KEY, ...) come from .env on the host at
# runtime; they are never copied into the image.
services:
  chat-api:
    build: .
    image: trendwise-chat-api:latest
    # Uses the image CMD (uvicorn --no-server-header: no "server" header).
    env_file: .env
    environment:
      LLM_PROVIDER: ${LLM_PROVIDER:-groq}
      # Overrides .env: API docs are never served on staging/prod.
      DOCS_ENABLED: "false"
    ports:
      - "8000:8000"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    
# Use the pre-created network on the shared server; never let Docker
# auto-assign a subnet (it can collide with the office LAN).
networks:
  default:
    name: trendwise-chatbot-api_default
    external: true
